name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *)
              echo "tag does not match vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" --generate-notes
